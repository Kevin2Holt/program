name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: progr_am
          POSTGRES_PASSWORD: progr_am
          POSTGRES_DB: progr_am_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U progr_am"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://progr_am:progr_am@localhost:5432/progr_am_ci_unused
      TEST_DATABASE_URL: postgres://progr_am:progr_am@localhost:5432/progr_am_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
